
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Control Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141b2d;
            --accent-gold: #ffb703;
            --accent-green: #2ec4b6;
            --accent-red: #e71d36;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border-color: #222b45;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Top Bar matching video */
        .top-connection-banner {
            background-color: #102a28;
            border: 1px solid var(--accent-green);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .top-connection-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .top-connection-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .top-connection-status {
            font-weight: 800;
            color: var(--accent-green);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .top-connection-broker {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Card Layout */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Form Inputs matching video style */
        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .form-control {
            width: 100%;
            padding: 7px 10px;
            background: #090d16;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.8rem;
        }

        /* Live Analysis Chart */
        .chart-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
            height: 80px;
            display: flex;
            align-items: flex-end;
        }

        .wave-svg {
            width: 100%;
            height: 60px;
        }

        @keyframes wavePulse {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
            100% { transform: translateY(0px); }
        }

        .animated-path {
            animation: wavePulse 2s ease-in-out infinite;
        }

        .analysis-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: var(--text-muted);
        }

        @keyframes dotBlink {
            0% { opacity: 0.3; }
            50% { opacity: 1; box-shadow: 0 0 8px var(--accent-green); }
            100% { opacity: 0.3; }
        }

        .status-dot {
            height: 6px;
            width: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: dotBlink 1.5s infinite;
        }

        .bot-footer-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            margin-bottom: 10px;
        }

        /* Buttons Panel */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .action-btn {
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background-color: var(--accent-green);
            color: #0b0f19;
        }

        .btn-stop {
            background-color: var(--accent-red);
            color: #fff;
        }

        .badge {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .badge-stopped { background: rgba(231, 29, 54, 0.2); color: var(--accent-red); }
        .badge-running { background: rgba(46, 196, 182, 0.2); color: var(--accent-green); }
    </style>
</head>
<body>

        <div class="top-connection-title">Account Status</div>
        <div class="top-connection-main">
            <span class="top-connection-status">CONNECTED</span>
            <span class="top-connection-broker" id="brokerLabel">Connected to Exness</span>
        </div>
    </div>

    <!-- MT5 Account
