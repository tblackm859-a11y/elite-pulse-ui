
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Pulse - MT5 Scalper Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-gold: #ffb703;
            --accent-green: #2ec4b6;
            --accent-red: #e71d36;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border-color: #1f293d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-stopped {
            background-color: rgba(231, 29, 54, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .status-running {
            background-color: rgba(46, 196, 182, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(46, 196, 182, 0.3);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .profit-pos { color: var(--accent-green); }
        .profit-neg { color: var(--accent-red); }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-start {
            background-color: var(--accent-green);
            color: #0b0f19;
        }

        .btn-stop {
            background-color: var(--accent-red);
            color: #fff;
        }

        .log-box {
            background: #070910;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            height: 90px;
            overflow-y: auto;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Elite Pulse</h1>
        <div id="botStatusBadge" class="status-badge status-stopped">STOPPED</div>
    </header>

    <!-- Financial Metrics -->
    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-label">Balance / Equity</div>
            <div class="metric-value" id="lblEquity">$1,000.00</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Floating P&L</div>
            <div class="metric-value profit-pos" id="lblPnL">+$0.00</div>
        </div>
    </div>

    <!-- Bot Configuration Panel -->
    <div class="card">
        <div class="control-group">
            <label>Trading Symbol</label>
            <select id="symbolSelect">
                <option value="XAUUSDm">XAUUSDm (Gold Micro)</option>
                <option value="EURUSDm">EURUSDm</option>
                <option value="GBPUSDm">GBPUSDm</option>
                <option value="BTCUSDm">BTCUSDm</option>
            </select>
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <label>Lot Size</label>
            <input type="number" id="lotSize" value="0.01" step="0.01" min="0.01" max="1.00">
        </div>

        <!-- Action Buttons -->
        <div class="btn-container">
            <button class="btn btn-start" onclick="startBot()">START BOT</button>
            <button class="btn btn-stop" onclick="stopBot()">STOP BOT</button>
        </div>
    </div>

    <!-- Live Execution Feed -->
    <div class="card">
        <div class="metric-label" style="margin-bottom: 6px;">LIVE EXECUTION LOGS</div>
        <div class="log-box" id="logBox">
            [System] Dashboard initialized. Ready to connect to Render backend...<br>
        </div>
    </div>

    <script>
        const RENDER_BACKEND_URL = "https://mt5-bot-2.onrender.com";

        function appendLog(message) {
            const logBox = document.getElementById('logBox');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timestamp}] ${message}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUIStatus(isRunning) {
            const badge = document.getElementById('botStatusBadge');
            if (isRunning) {
                badge.className = "status-badge status-running";
                badge.innerText = "RUNNING";
            } else {
                badge.className = "status-badge status-stopped";
                badge.innerText = "STOPPED";
            }
        }

        async function startBot() {
            const symbol = document.getElementById('symbolSelect').value;
            const lot = document.getElementById('lotSize').value;
            appendLog(`Sending START request (${symbol}, Lot: ${lot})...`);
            
            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/bot/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol, lot: lot })
                });
                const data = await response.json();
                if (data.success) {
                    updateUIStatus(true);
                    appendLog("Success: Bot loop running on Render!");
                } else {
                    appendLog("Notice: " + data.message);
                }
            } catch (err) {
                appendLog("Error: Could not connect to Render backend.");
                console.error(err);
            }
        }

        async function stopBot() {
            appendLog("Sending STOP request...");
            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/bot/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (data.success) {
                    updateUIStatus(false);
                    appendLog("Success: Bot stopped.");
                }
            } catch (err) {
                appendLog("Error: Failed to reach backend.");
                console.error(err);
            }
        }
    </script>
</body>
                                                                </html>
