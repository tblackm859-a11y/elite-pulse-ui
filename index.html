
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Pulse - MT5 Control Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-gold: #ffb703;
            --accent-green: #2ec4b6;
            --accent-red: #e71d36;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border-color: #1f293d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            color: var(--accent-gold);
        }

        .connection-banner {
            background: rgba(46, 196, 182, 0.1);
            border: 1px solid var(--accent-green);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .connection-status {
            font-weight: bold;
            color: var(--accent-green);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .analysis-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            color: var(--text-muted);
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px var(--accent-green);
        }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start { background-color: var(--accent-green); color: #0b0f19; }
        .btn-stop { background-color: var(--accent-red); color: #fff; }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .stopped { background: rgba(231, 29, 54, 0.2); color: var(--accent-red); }
        .running { background: rgba(46, 196, 182, 0.2); color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Elite Pulse</h1>
        <span id="topBadge" class="status-badge stopped">STOPPED</span>
    </header>

    <!-- Connection Banner matching reference -->
    <div class="connection-banner">
        <div>
            <div style="font-size: 0.7rem; color: var(--text-muted);">Account Status</div>
            <div class="connection-status" id="connText">CONNECTED</div>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted);" id="brokerDisplay">Connected to Broker</div>
    </div>

    <!-- MT5 Account Configuration Card -->
    <div class="card">
        <div class="card-header">
            <span>🎛️ MT5 ACCOUNT CONFIG</span>
            <span style="font-size: 0.7rem; color: var(--accent-green); cursor: pointer;" onclick="saveCredentials()">Save</span>
        </div>
        <div class="form-group">
            <label>Broker Name</label>
            <input type="text" id="brokerInput" value="Exness">
        </div>
        <div class="form-group">
            <label>Login ID</label>
            <input type="text" id="loginInput" value="56197382">
        </div>
        <div class="form-group">
            <label>Server</label>
            <input type="text" id="serverInput" value="Exness-Real23">
        </div>
    </div>

    <!-- Live Analysis Feed -->
    <div class="card">
        <div class="card-header">📈 LIVE ANALYSIS</div>
        <div class="analysis-item"><span>Detecting market structure</span> <span class="dot"></span></div>
        <div class="analysis-item"><span>Calibrating stop loss parameters</span> <span class="dot"></span></div>
        <div class="analysis-item" style="border:none;"><span>AI execution scoring active</span> <span class="dot"></span></div>
    </div>

    <!-- Bot Control Panel -->
    <div class="card">
        <div class="card-header">
            <span>🤖 BOT CONTROL</span>
            <span id="botStateBadge" class="status-badge stopped">STOPPED</span>
        </div>
        <div class="btn-container">
            <button class="btn btn-start" onclick="startBot()">START BOT</button>
            <button class="btn btn-stop" onclick="stopBot()">STOP BOT</button>
        </div>
    </div>

    <script>
        const RENDER_BACKEND_URL = "https://mt5-bot-2.onrender.com";

        function saveCredentials() {
            const broker = document.getElementById('brokerInput').value;
            const login = document.getElementById('loginInput').value;
            const server = document.getElementById('serverInput').value;
            
            document.getElementById('brokerDisplay').innerText = `Connected to ${broker}`;
            alert("MT5 Credentials saved locally & synced!");
        }

        async function startBot() {
            const broker = document.getElementById('brokerInput').value;
            const login = document.getElementById('loginInput').value;
            const server = document.getElementById('serverInput').value;

            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/bot/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ broker, login, server })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('topBadgeclassName').className = "status-badge running";
                    document.getElementById('topBadge').innerText = "RUNNING";
                    document.getElementById('botStateBadge').className = "status-badge running";
                    document.getElementById('botStateBadge').innerText = "RUNNING";
                    alert("Bot started successfully on your MT5 account!");
                }
            } catch (err) {
                alert("Error connecting to Render backend.");
            }
        }

        async function stopBot() {
            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/bot/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('topBadge').className = "status-badge stopped";
                    document.getElementById('topBadge').innerText = "STOPPED";
                    document.getElementById('botStateBadge').className = "status-badge stopped";
                    document.getElementById('botStateBadge').innerText = "STOPPED";
                    alert("Bot stopped.");
                }
            } catch (err) {
                alert("Error reaching backend.");
            }
        }
    </script>
</body>
    </html>
