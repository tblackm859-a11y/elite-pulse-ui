
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Control Dashboard</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .banner {
            background-color: #102a28;
            border: 1px solid #2ec4b6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .banner-title {
            font-size: 0.65rem;
            color: #8d99ae;
            text-transform: uppercase;
        }

        .banner-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .status-text {
            font-weight: bold;
            color: #2ec4b6;
            font-size: 1rem;
        }

        .broker-text {
            font-size: 0.75rem;
            color: #8d99ae;
        }

        .card {
            background-color: #141b2d;
            border: 1px solid #222b45;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffb703;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.65rem;
            color: #8d99ae;
            margin-bottom: 3px;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            background: #090d16;
            border: 1px solid #222b45;
            color: #f8f9fa;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .chart-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
        }

        svg {
            width: 100%;
            height: 60px;
        }

        @keyframes pulse {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0px); }
        }

        .wave {
            animation: pulse 2s ease-in-out infinite;
        }

        .analysis-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #8d99ae;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .dot {
            height: 6px;
            width: 6px;
            background-color: #2ec4b6;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ec4b6;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-start { background-color: #2ec4b6; color: #0b0f19; }
        .btn-stop { background-color: #e71d36; color: #fff; }
